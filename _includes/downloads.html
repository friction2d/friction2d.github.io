<div class="blocks">
    <div class="block block25 center darkAlpha blurry">
        <img height="100px" src="{{ site.url }}/assets/downloads/windows.svg" />
        <h2>Windows</h2>
        <p>
            <a href="{{ site.github_download_url }}v{{ page.release }}/friction-{{ page.release }}-{{ site.github_release_suffix_windows_setup }}" class="btn-download">
                <img src="{{ site.url }}/assets/downloads/download.svg" alt="Download">
                <span>Download</span>
            </a>
            <br>
            <a href="{{ site.github_download_url }}v{{ page.release }}/friction-{{ page.release }}-{{ site.github_release_suffix_windows_portable }}" class="btn-download-small">
                <img src="{{ site.url }}/assets/downloads/box.svg" alt="Download">
                <span>Portable Version</span>
            </a>
            {% if page.download_devel %}
            <br>
            <a href="https://windows.ci.friction.graphics" class="btn-download-small-red">
                <img src="{{ site.url }}/assets/downloads/download.svg" alt="Download">
                <span>Development Version</span>
            </a>
            {% endif %}
        </p>
    </div>
    <div class="block block25 center darkAlpha blurry">
        <img height="100px" src="{{ site.url }}/assets/downloads/linux.svg" />
        <h2>Linux</h2>
        <p>
            <a href="{{ site.github_download_url }}v{{ page.release }}/Friction-{{ page.release }}-{{ site.github_release_suffix_linux_appimage }}" class="btn-download">
                <img src="{{ site.url }}/assets/downloads/download.svg" alt="Download">
                <span>Download</span>
            </a>
            {% if page.download_devel %}
            <br>
            <a href="https://linux.ci.friction.graphics" class="btn-download-small-red">
                <img src="{{ site.url }}/assets/downloads/download.svg" alt="Download">
                <span>Development Version</span>
            </a>
            {% endif %}
        </p>
    </div>
    <div class="block block25 center darkAlpha blurry">
        <img height="100px" src="{{ site.url }}/assets/downloads/apple.svg" />
        <h2>macOS</h2>
        <p>
            <a href="{{ site.github_download_url }}v{{ page.release }}/Friction-{{ page.release }}{{ site.github_release_suffix_mac_uni_dmg }}" class="btn-download">
                <img src="{{ site.url }}/assets/downloads/download.svg" alt="Download">
                <span>Download</span>
            </a>
            {% if page.download_devel %}
            <br>
            <a href="https://macos.ci.friction.graphics" class="btn-download-small-red">
                <img src="{{ site.url }}/assets/downloads/download.svg" alt="Download">
                <span>Development Version</span>
            </a>
            {% endif %}
        </p>
    </div>

        <p>

                <span>Download</span>
            </a>
        </p>
    </div> -->
</div>
